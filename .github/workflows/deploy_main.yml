name: Create, publish Docker image and Deploy using webhook

on:
  push:
    branches: ['main']

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.DEPLOY_TOKEN }}

      # Buildx med containerdrivrutin, så att lagren kan sparas i GitHubs byggcache (type=gha):
      # oförändrade lager (npm ci, Chromium i snap) byggs då inte om vid nästa körning
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=publicomtools
          cache-to: type=gha,mode=max,scope=publicomtools
          # Baked into the Next.js build at compile time (see Dockerfile and
          # next.config.ts) — must match the Traefik PathPrefix this image
          # is deployed behind on apps.lib.kth.se.
          build-args: |
            BASE_PATH=/publicomtools

      # Renderingstjänsten för Sida som bild (snap/), en egen avbild med samma taggar
      - name: Extract metadata for the snap image
        id: meta-snap
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-snap

      - name: Build and push snap image
        uses: docker/build-push-action@v7
        with:
          context: ./snap
          push: true
          tags: ${{ steps.meta-snap.outputs.tags }}
          labels: ${{ steps.meta-snap.outputs.labels }}
          cache-from: type=gha,scope=publicomtools-snap
          cache-to: type=gha,mode=max,scope=publicomtools-snap

  deploy:
    needs: build-and-push-image
    runs-on: ubuntu-latest
    steps:
      - name: Deploy docker container webhook
        uses: distributhor/workflow-webhook@v2
        env:
          webhook_url: https://api.lib.kth.se/webhooks/hook
          webhook_secret: ${{ secrets.WEBHOOK_SECRET }}
          data: '{ "action": "deploy" }'
          push: true
