name: Spegla node-avbilden till ghcr.io

# Byggena (Dockerfile, snap/Dockerfile) hämtar node från ghcr.io/kth-biblioteket/node i stället för
# från AWS spegel av Docker Hub (public.ecr.aws), som ibland svarar 429 "Data limit exceeded" för
# GitHubs delade byggmaskiner. Kör det här en gång per node-version (Actions → Spegla node-avbilden
# → Run workflow), innan versionen byts i Dockerfilerna. Kopierar alla arkitekturer oförändrade.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Node-versionen, t.ex. 22.23.2 (samma som i .nvmrc)"
        required: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.DEPLOY_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Copy node:${{ inputs.version }}-alpine
        env:
          VERSION: ${{ inputs.version }}
        run: |
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "Ogiltig version: $VERSION"; exit 1; }
          # AWS spegel först, Docker Hub som reserv (samma officiella avbild); några försök var, eftersom
          # båda kan svara 429 för GitHubs delade byggmaskiner. En lyckad kopiering räcker.
          for i in 1 2 3; do
            for src in "public.ecr.aws/docker/library/node:${VERSION}-alpine" "docker.io/library/node:${VERSION}-alpine"; do
              echo "Kopierar från $src"
              docker buildx imagetools create -t "ghcr.io/kth-biblioteket/node:${VERSION}-alpine" "$src" && ok=1 && break 2
            done
            sleep 60
          done
          [ "$ok" = 1 ] || exit 1
          docker buildx imagetools inspect "ghcr.io/kth-biblioteket/node:${VERSION}-alpine"
