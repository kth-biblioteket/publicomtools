# Production deployment, same pattern as bookingtools: image built and pushed
# to ghcr.io by CI, run on the shared apps-net network behind Traefik. Not
# used for local dev — see docker-compose-dev.yml.
#
# Deploy prerequisites on the server:
#   - the external "apps-net" network exists (docker network create apps-net)
#   - a .env file next to this one (copy .env.example) — read by Compose for
#     the ${VAR} substitution below
#   - a publicomtools.env file next to this one (copy
#     publicomtools.env.example) — injected into the app container
#
# First deploy / after pulling a new image:
#   docker compose up -d
# (prisma migrate deploy runs on container start — see docker-entrypoint.sh)

services:
  publicomtools:
    container_name: publicomtools
    image: ghcr.io/kth-biblioteket/publicomtools:${REPO_TYPE}
    restart: always
    environment:
      TZ: ${TZ}
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@publicomtools-db:5432/${DB_DATABASE}
      # Must match both the Traefik PathPrefix below AND the BASE_PATH the
      # image was built with (see Dockerfile).
      BASE_PATH: ${PATHPREFIX}
    env_file:
      - publicomtools.env
    # Skyltarnas mediebibliotek: en vanlig mapp på servern, så att serverns filbackup tar med den
    # (Dockers egna volymer säkerhetskopieras inte). Skapa den före första start:
    #   mkdir -p /local/docker/publicomtools/media && chown 1001:1001 /local/docker/publicomtools/media
    volumes:
      - "/local/docker/publicomtools/media:/data/media"
    depends_on:
      - publicomtools-db
      - publicomtools-snap
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.publicomtools.rule=Host(`${DOMAIN_NAME}`) && PathPrefix(`${PATHPREFIX}`)"
      - "traefik.http.routers.publicomtools.entrypoints=websecure"
      - "traefik.http.routers.publicomtools.tls=true"
      - "traefik.http.routers.publicomtools.tls.certresolver=myresolver"
    networks:
      - "apps-net"
      - "snap-net"

  # Sida som bild: headless Chromium som renderar skyltsidor till bilder åt publicomtools (snap/).
  # Bara på det egna nätet snap-net: publicomtools når den på http://publicomtools-snap:3000,
  # men den når inte databasen eller andra tjänster på apps-net. Ingen volym och ingen port utåt.
  publicomtools-snap:
    container_name: publicomtools-snap
    image: ghcr.io/kth-biblioteket/publicomtools-snap:${REPO_TYPE}
    restart: always
    mem_limit: 768m
    environment:
      TZ: ${TZ}
    # Serverns eget namn (apps.lib.kth.se på prod) pekar inifrån en container på serverns publika
    # adress, som inte svarar dit. host-gateway = servern själv, där Traefik tar emot på 443. Kräver
    # att ufw släpper in snap-nätet (gränssnittet br-ptsnap nedan) på port 443:
    #   sudo ufw allow in on br-ptsnap to any port 443 proto tcp comment 'publicomtools-snap till Traefik'
    extra_hosts:
      - "${DOMAIN_NAME}:host-gateway"
    networks:
      - "snap-net"

  publicomtools-db:
    container_name: publicomtools-db
    # Same exact patch version as docker-compose-dev.yml.
    image: postgres:16.14-alpine
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - persistent-publicomtools-db:/var/lib/postgresql/data
    networks:
      - "apps-net"

volumes:
  persistent-publicomtools-db:
    name: persistent-publicomtools-db

networks:
  apps-net:
    external: true
  snap-net:
    name: publicomtools-snap-net
    driver_opts:
      # Fast namn på nätets gränssnitt, så att ufw-regeln gäller även när nätet skapas om
      com.docker.network.bridge.name: br-ptsnap
