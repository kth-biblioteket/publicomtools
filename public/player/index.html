<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PubLiPlayer</title>
  <script>
    // Felsökning: öppna sidan med ?debug (t ex .../index.html?debug=1; ?debugtv = även testvideo, ?debugns = utan sandbox, utan &)
    // så visas webbläsaren, storleken och alla skriptfel
    // som text överst på skärmen. Utan ?debug händer inget.
    (function () {
      if (location.search.indexOf('debug') < 0) return;
      var box = document.createElement('pre');
      box.id = 'debug';
      // Vänstra delen av skärmen (testvideon ligger till höger). De 5 första raderna ligger kvar, sedan de senaste raderna.
      box.style.cssText = 'position:fixed;left:0;top:0;width:58%;z-index:999;margin:0;padding:8px;background:#fff;color:#000;font:16px monospace;white-space:pre-wrap;word-break:break-all;max-height:100%;overflow:hidden';
      document.documentElement.appendChild(box);
      var head = [], tail = [], KEEP = 5, MAX_TAIL = 22;
      function log(t) {
        t = String(t);
        if (head.length < KEEP) head.push(t);
        else { tail.push(t); if (tail.length > MAX_TAIL) tail.shift(); }
        box.textContent = head.join('\n') + (tail.length ? '\n' + tail.join('\n') : '') + '\n';
      }
      window.PP_debug = log;
      log('UA: ' + navigator.userAgent);
      log('storlek: ' + window.innerWidth + 'x' + window.innerHeight);
      log('fetch=' + (typeof fetch) + ' Promise=' + (typeof Promise) + ' online=' + navigator.onLine);
      try { localStorage.setItem('publiplayer.t', '1'); localStorage.removeItem('publiplayer.t'); log('localStorage ok'); } catch (e) { log('localStorage FEL: ' + e.message); }
      window.onerror = function (m, src, line, col) { log('FEL: ' + m + ' @' + String(src || '').split('/').pop() + ':' + line + ':' + col); };
      window.addEventListener('unhandledrejection', function (e) { log('AVVISAT: ' + (e.reason && e.reason.message || e.reason)); });
      window.addEventListener('error', function (e) { if (e.target && e.target.src) log('LADDNINGSFEL: ' + e.target.src); }, true);
      window.addEventListener('load', function () { log('storlek vid laddning: ' + window.innerWidth + 'x' + window.innerHeight); });
      log('felsökning på');
    })();
  </script>
  <link rel="stylesheet" href="css/player.css">
</head>
<body>
  <div id="stage">
    <video id="film" muted loop playsinline preload="auto"></video>

    <div id="frames" class="hidden">
      <iframe id="frame-a" src="about:blank" scrolling="no" tabindex="-1"></iframe>
      <iframe id="frame-b" src="about:blank" scrolling="no" tabindex="-1"></iframe>
    </div>

    <div id="fade"></div>

    <div id="error" class="overlay hidden">
      <p id="error-sv"></p>
      <p id="error-en" class="en"></p>
    </div>

    <div id="enroll" class="overlay hidden">
      <form id="enroll-form" autocomplete="off">
        <h1>PubLiPlayer</h1>
        <label for="enroll-url">Adress till publicomtools</label>
        <input id="enroll-url" type="url" spellcheck="false">
        <label for="enroll-code">Inskrivningskod från admin</label>
        <input id="enroll-code" type="text" spellcheck="false" autocapitalize="off">
        <button type="submit">Skriv in</button>
        <p id="enroll-msg" role="status"></p>
      </form>
    </div>
  </div>

  <script src="js/env.js"></script>
  <script src="js/schedule.js"></script>
  <script src="js/store.js"></script>
  <script src="js/client.js"></script>
  <script src="js/rotator.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
